[workspace]
members = ["common","directory_monitoring", "task", "tools", "server", "process_manager", "user_manager"]
resolver = "3"

[workspace.dependencies]
# framework
notify = "8.2.0"
tokio = "1.51.1"
tokio-macros = "2.6.0"
sea-orm = { version = "1.1.20", features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite"] }
rocket = { version = "0.5.1", features = ["secrets", "json"] }
rocket_ws = { version = "0.1.1" }
sqlx-sqlite = { version = "0.8.6", features = ["bundled"] }

# utilities
os_info = "3.14.0"
libc = "0.2.184"
once_cell = "1.21.3"
serde = { version = "1.0.219" }
serde_json = { version = "1.0.142" }
toml = { version = "0.8.23" }
uuid = { version = "1.17.0" }
bcrypt = { version = "0.17.1" }
chrono = "0.4.44"
dashmap = "6.2.1"
sysinfo = "0.38.4"
# logger
log = { version = "0.4" }
log4rs = { version = "1.4.0", features = ["pattern_encoder", "json_encoder"] }
